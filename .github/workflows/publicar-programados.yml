name: Publicar programados

# Publica la cola _programadas/: toda carpeta cuya fecha y hora ya vencieron.
# Convencion de la cola: ver _programadas/README.md
#
# Corre cada 30 minutos entre las 8:00 y las 22:30 ART (UTC-3, sin horario de verano).

on:
  # Los minutos :00 y :30 son los mas congestionados de GitHub Actions y las
  # corridas programadas se descartan, no se encolan. Por eso se disparan en
  # minutos impares y poco usados.
  schedule:
    - cron: '7,37 11-23 * * *' # 08:07 - 20:37 ART
    - cron: '7,37 0-1 * * *' # 21:07 - 22:37 ART
  # Ademas de la agenda: cada push a main evalua la cola al instante. Sirve para
  # que una carpeta ya vencida salga apenas se sube, sin esperar al cron. Los
  # commits que hace el propio publicador usan GITHUB_TOKEN y no reactivan este
  # disparador, asi que no hay bucle.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      carpeta:
        description: 'Carpeta a publicar YA (ej. 2026-09-01 o 2026-09-01_1430). Vacio = todas las vencidas.'
        required: false
        default: ''

concurrency:
  group: publicar-programados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configurar git
        # El autor del commit tiene que ser miembro del proyecto en Vercel; si no,
        # Vercel rechaza el deploy con "not a member of the team".
        run: |
          git config --local user.email "114360771+hsotes@users.noreply.github.com"
          git config --local user.name "hsotes"

      - name: Ver si hay algo vencido
        id: cola
        env:
          PUBLICAR_CARPETA: ${{ github.event.inputs.carpeta }}
        run: echo "pendientes=$(node scripts/publicador/publicar.mjs --contar)" >> "$GITHUB_OUTPUT"

      # Solo se instalan dependencias cuando hay algo para publicar: el build de
      # control las necesita, y las corridas vacias (la mayoria) salen en segundos.
      - name: Instalar dependencias
        if: steps.cola.outputs.pendientes != '0'
        run: npm ci

      - name: Publicar
        if: steps.cola.outputs.pendientes != '0'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          PUBLICAR_CARPETA: ${{ github.event.inputs.carpeta }}
        run: node scripts/publicador/publicar.mjs

      # A las 22:00 ART, si la cola quedo sin nada pendiente, el job falla a
      # proposito para que GitHub mande el mail esa misma noche.
      # Solo en las corridas programadas: un push cualquiera no tiene por que
      # fallar por el estado de la cola.
      - name: Aviso de cola vacia
        if: success() && github.event_name == 'schedule'
        run: node scripts/publicador/publicar.mjs --alerta
